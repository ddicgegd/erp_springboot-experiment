spring:
  main:
    allow-bean-definition-overriding: true
    lazy-initialization: false

  flyway:
    enabled: false

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.mail.MailHealthContributorAutoConfiguration
      - org.redisson.spring.starter.RedissonAutoConfigurationV2

  # H2 in-memory database — Oracle compatibility mode
  datasource:
    url: jdbc:h2:mem:testdb;MODE=Oracle;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      initialization-fail-timeout: -1

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  # Tắt Kafka — dùng stream test binder
  cloud:
    stream:
      default-binder: test

  # Tắt kafka listener
  kafka:
    bootstrap-servers: localhost:9093
    admin:
      auto-create: false
    listener:
      auto-startup: false

  # Tắt mail — sẽ throw exception nếu có
  mail:
    host: localhost
    port: 9999
    username: test
    password: test
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:app_admin}
      password: ${REDIS_PASSWORD:admin789}

  # Tắt cache cho test
  cache:
    type: none

  # Tắt devtools
  devtools:
    restart:
      enabled: false

integration:
  minio:
    access-key: admin
    secret-key: admin12345
    url: http://localhost:9000
    bucket: test-bucket

# Tắt swagger trong test
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: WARN
    org.hibernate: WARN
    org.springframework: WARN
    com.ddicg.erp: WARN

server:
  url: http://localhost:8080

frontend:
  url: http://localhost:5173/berry-vue

application:
  security:
    jwt:
      secret-key: test-secret-key

app:
  redisson:
    enabled: false
  fineract:
    enabled: false

fineract:
  base-url: http://localhost:8443/fineract-provider/api/v1
  tenant-id: default
  username: mifos
  password: password
  office-id: 1
  legal-form-id: 1
  date-format: "dd MMMM yyyy"
  locale: "en"
  ssl-bypass: true
  cash-gl-account-id: 1
  bank-gl-account-id: 4
  sales-revenue-gl-account-id: 2
  sales-returns-gl-account-id: 3
  currency-code: VND
