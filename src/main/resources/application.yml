spring:
  application:
    name: ERP_SpringBoot-Experiment
  profiles:
    default: dev
  cache:
    type: caffeine

  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfigurationV2

  config:
    import: optional:file:.env[.properties]

  contact:
    name: ANNOEYE
    url: zalo.me/0971791373
    email: annoeye@gmail.com

  main:
    allow-bean-definition-overriding: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    mapper:
      default-view-inclusion: true

  kafka:
    admin:
      fail-fast: false
      auto-create: true
      properties:
        request.timeout.ms: 5000
        default.api.timeout.ms: 5000
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        linger.ms: 5
    consumer:
      group-id: erp-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        spring.json.trusted.packages: "*"
    listener:
      ack-mode: record
      missing-topics-fatal: false

  jpa:
    open-in-view: false

  output:
    ansi:
      enabled: ALWAYS

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB
  mvc:
    problemdetails:
      enabled: true

server:
  port: 8080

# MCP (Model Context Protocol) Configuration
mcp:
  enabled: true
  endpoint: /mcp
  server-name: ERP-MCP-Server
  server-version: 1.0.0
  protocol-version: 2025-06-18
  session:
    timeout-minutes: 30
  servers:
    kafka:
      enabled: true
    redis:
      enabled: true
    database:
      enabled: true
    minio:
      enabled: true
    frontend:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    enabled: true
    operations-sorter: method
    display-request-duration: true
    tags-sorter: alpha
  show-actuator: false
  default-produces-media-type: application/json

logging:
  level:
    root: INFO
    com:
      ddicg:
        erp: INFO
    org:
      springframework: INFO
      apache:
        kafka: WARN
      hibernate:
        tool:
          schema:
            internal:
              ExceptionHandlerLoggedImpl: ERROR
  pattern:
    console: "%boldYellow(%d{HH:mm:ss.SSS}) %boldCyan(%d{yyyy-MM-dd}) %green([%thread]) %highlight(%-5level) %cyan(%logger{36}) %magenta([%file:%line]) %yellow(-) %msg%n%clr(%wEx){red}"

management:
  health:
    mail:
      enabled: false
