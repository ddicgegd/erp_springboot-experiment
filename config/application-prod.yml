spring:
  application:
    name: ERP_SpringBoot-Experiment
  cache:
    type: caffeine

  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfigurationV2

  config:
    import: optional:file:.env[.properties]

  contact:
    name: ANNOEYE
    url: zalo.me/0971791373
    email: annoeye@gmail.com

  main:
    allow-bean-definition-overriding: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    mapper:
      default-view-inclusion: true

  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@localhost:1521/XEPDB1}
    username: ${DB_USERNAME:Spring_app}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      initialization-fail-timeout: -1

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9093}
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:SASL_PLAINTEXT}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:PLAIN}
      sasl.jaas.config: org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_USER:kafka}" password="${KAFKA_PASSWORD:kafka@2025}";
    admin:
      fail-fast: false
      auto-create: true
      properties:
        request.timeout.ms: 5000
        default.api.timeout.ms: 5000
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        linger.ms: 5
    consumer:
      group-id: erp-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        spring.json.trusted.packages: "*"
    listener:
      ack-mode: record
      missing-topics-fatal: false
      concurrency: 3
      auto-startup: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    out-of-order: false
    repair-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:app_erp}
      password: ${REDIS_PASSWORD:${REDIS_ERP_PASSWORD:}}
      database: ${REDIS_DATABASE:0}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:placeholder@example.com}
    password: ${MAIL_PASSWORD:placeholder_password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  output:
    ansi:
      enabled: ALWAYS

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB

  mvc:
    problemdetails:
      enabled: true

server:
  port: 8080
  url: ${SERVER_URL:http://localhost:8080}

frontend:
  url: ${FRONTEND_URL:http://localhost:5173/berry-vue}

# MCP (Model Context Protocol) Configuration
mcp:
  enabled: true
  endpoint: /mcp
  server-name: ERP-MCP-Server
  server-version: 1.0.0
  protocol-version: 2025-06-18
  session:
    timeout-minutes: 30
  servers:
    kafka:
      enabled: true
    redis:
      enabled: true
    database:
      enabled: true
    minio:
      enabled: true
    frontend:
      enabled: true

integration:
  minio:
    access-key: ${MINIO_ACCESS_KEY:admin}
    secret-key: ${MINIO_SECRET_KEY}
    url: ${MINIO_URL:http://localhost:9000}

geocoding:
  nominatim:
    url: ${GEOCODING_NOMINATIM_URL}
  user-agent: ${GEOCODING_USER_AGENT}

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET}
      access-token-expiration-minutes: ${JWT_ACCESS_EXPIRATION_MINUTES:1440}
      refresh-token-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:90}

fineract:
  base-url: ${FINERACT_BASE_URL:https://localhost:8443/fineract-provider/api/v1}
  tenant-id: ${FINERACT_TENANT_ID:default}
  username: ${FINERACT_USERNAME:mifos}
  password: ${FINERACT_PASSWORD:password}
  default-office-id: 1
  default-legal-form-id: 1
  date-format: "dd MMMM yyyy"
  locale: "en"
  ssl-bypass: ${FINERACT_SSL_BYPASS:true}
  cash-gl-account-id: ${FINERACT_CASH_GL_ACCOUNT_ID:1}
  sales-revenue-gl-account-id: ${FINERACT_SALES_REVENUE_GL_ACCOUNT_ID:2}
  sales-returns-gl-account-id: ${FINERACT_SALES_RETURNS_GL_ACCOUNT_ID:3}

app:
  fineract:
    enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    enabled: true
    operations-sorter: method
    display-request-duration: true
    tags-sorter: alpha
  show-actuator: false
  default-produces-media-type: application/json

logging:
  pattern:
    console: "%boldYellow(%d{HH:mm:ss.SSS}) %boldCyan(%d{yyyy-MM-dd}) %green([%thread]) %highlight(%-5level) %cyan(%logger{36}) %magenta([%file:%line]) %yellow(-) %msg%n%clr(%wEx){red}"
  level:
    root: INFO
    com:
      ddicg:
        erp: INFO
    org:
      springframework: INFO
      apache:
        kafka: WARN
      hibernate:
        tool:
          schema:
            internal:
              ExceptionHandlerLoggedImpl: ERROR

management:
  health:
    mail:
      enabled: false
