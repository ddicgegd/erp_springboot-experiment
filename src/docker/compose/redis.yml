# =============================================================================
# Redis with ACL-based authentication
# =============================================================================

services:
  redis:
    image: redis:8.6.4-alpine3.23
    container_name: redis
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 128M
          cpus: "0.25"
    ports:
      - "6379:6379"
    env_file:
      - ../.env
    volumes:
      - redis-data:/data
      - type: tmpfs
        target: /tmp
    command: >
      sh -c "
      mkdir -p /etc/redis &&
      echo 'user default on >'$${REDIS_DEFAULT_PASSWORD}' ~* +@all' > /etc/redis/users.acl &&
      echo 'user app_admin on >'$${REDIS_ADMIN_PASSWORD}' ~* +@all' >> /etc/redis/users.acl &&
      echo 'user app_cache on >'$${REDIS_CACHE_PASSWORD}' ~* +@read +@write +set +get +del +exists +expire +ttl +hset +hget +hdel +hexists +hgetall +hmget +hmset -@dangerous -@admin -@slow' >> /etc/redis/users.acl &&
      echo 'user app_websocket on >'$${REDIS_WEBSOCKET_PASSWORD}' ~* &* +@read +@write +@pubsub +ping +info +client -@dangerous -@admin -@slow' >> /etc/redis/users.acl &&
      echo 'user mcp-redis on >redisredis ~* &* -@all +@read +ping +info' >> /etc/redis/users.acl &&
      exec redis-server --aclfile /etc/redis/users.acl --maxmemory 256mb --maxmemory-policy allkeys-lru --maxclients 100
      "
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a $${REDIS_DEFAULT_PASSWORD} ping > /dev/null 2>&1 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      backend:
        aliases:
          - redis
      frontend: {}
