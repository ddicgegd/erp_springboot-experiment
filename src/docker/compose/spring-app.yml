# =============================================================================
# Spring Boot Application
# =============================================================================

services:
  spring-app:
    build:
      context: ../../../
      dockerfile: Dockerfile
      args:
        JAVA_OPTS: "-Xmx512m -XX:+UseG1GC -XX:+UseStringDeduplication"
    container_name: spring-app
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - NET_ADMIN
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
        reservations:
          memory: 512M
          cpus: "0.5"
    ports:
      - "8080:8080"
    depends_on:
      oracle-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Load shared env vars from the docker env file
    # These are consumed directly by Spring Boot via application.yml placeholders
    env_file:
      - ../.env
    environment:
      # Spring profile
      SPRING_PROFILES_ACTIVE: docker
      TZ: Asia/Ho_Chi_Minh

      # Docker service discovery overrides (Spring defaults are localhost)
      SPRING_DATASOURCE_URL: jdbc:oracle:thin:@oracle-db:1521/XEPDB1
      SPRING_DATASOURCE_USERNAME: SPRING_APP
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_DATA_REDIS_HOST: redis
      FINERACT_BASE_URL: https://host.docker.internal:8443/fineract-provider/api/v1
      INTEGRATION_MINIO_URL: http://minio:9000
      INTEGRATION_MINIO_ACCESS_KEY: ${MINIO_USER}
      INTEGRATION_MINIO_SECRET_KEY: ${MINIO_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL: PLAINTEXT
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: [ "CMD", "curl", "-sf", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      frontend:
        aliases:
          - spring-app
      backend: {}
