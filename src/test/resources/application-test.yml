spring:
  main:
    allow-bean-definition-overriding: true
    lazy-initialization: false

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.mail.MailHealthContributorAutoConfiguration
      - org.redisson.spring.starter.RedissonAutoConfigurationV2

  # H2 in-memory database — Oracle compatibility mode
  datasource:
    url: jdbc:h2:mem:testdb;MODE=Oracle;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      initialization-fail-timeout: -1

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  # Tắt Kafka — dùng stream test binder
  cloud:
    stream:
      default-binder: test

  # Tắt kafka listener
  kafka:
    bootstrap-servers: localhost:9093
    admin:
      auto-create: false
    listener:
      auto-startup: false

  # Tắt mail — sẽ throw exception nếu có
  mail:
    host: localhost
    port: 9999
    username: test
    password: test
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  data:
    redis:
      host: localhost
      port: 6379

  # Tắt cache cho test
  cache:
    type: none

  # Tắt devtools
  devtools:
    restart:
      enabled: false

integration:
  minio:
    access-key: admin
    secret-key: admin12345
    url: http://localhost:9000
    bucket: test-bucket

# Tắt swagger trong test
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    org.springframework.test: INFO
    com.ddicg.erp: INFO

server:
  url: http://localhost:8080

frontend:
  url: http://localhost:5173/berry-vue

application:
  security:
    jwt:
      secret-key: test-secret-key

app:
  redisson:
    enabled: false
